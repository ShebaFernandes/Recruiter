services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enter
      POSTGRES_USER: enter
      POSTGRES_PASSWORD: enter
    ports:
      - "5433:5432"
    volumes:
      - enter-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enter"]
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only
      DATABASE_URL: postgresql://enter:enter@db:5432/enter
      RESUME_QUEUE_BACKEND: database
      RESUME_SCANNER_BACKEND: development
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only
      DATABASE_URL: postgresql://enter:enter@db:5432/enter
      ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      FRONTEND_URL: http://127.0.0.1:5173
      RESUME_QUEUE_BACKEND: database
      RESUME_SCANNER_BACKEND: development
    ports:
      - "8010:8000"
    volumes:
      - resume-media:/app/backend/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "manage.py", "run_resume_worker"]
    environment:
      DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only
      DATABASE_URL: postgresql://enter:enter@db:5432/enter
      ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      FRONTEND_URL: http://127.0.0.1:5173
      RESUME_QUEUE_BACKEND: database
      RESUME_SCANNER_BACKEND: development
    volumes:
      - resume-media:/app/backend/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  enter-postgres:
  resume-media:
