[project]
name = "enter-talent-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=2.3,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5.4,<6",
  "python-docx>=1.1,<2",
  "django-storages[s3]>=1.14,<2",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
python_files = ["test_*.py"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/talent/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
