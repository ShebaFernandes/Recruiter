map $uri $frontend_cache_control {
  default "";
  /index.html "no-cache, max-age=0, must-revalidate";
  "~^/assets/.+-[A-Za-z0-9_-]{8,}[.](js|css)$" "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  # Verification/reset tokens can occur in SPA query strings; never log them.
  access_log off;
  include /etc/nginx/enter-controls/*.conf;

  add_header X-Content-Type-Options nosniff always;
  # Keep this at server scope so every static location inherits security headers.
  # Successful responses and 304s only: never cache a missing asset as immutable.
  add_header Cache-Control $frontend_cache_control;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

  location ~ ^/api/v1/candidate/(resumes|photo)/$ {
    client_max_body_size 6m;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Used by the local Compose stack. Production Caddy routes API requests
  # directly to Django while preserving the same-origin boundary.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Root and SPA routes internally resolve to index.html and its revalidation rule.
  # Already-open SPA tabs still need a reload to run a newly deployed release.
  location /assets/ {
    try_files $uri =404;
  }

  # This app has no service worker. Do not return SPA HTML at worker script URLs.
  location ~ ^/(sw|service-worker)[.]js$ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
