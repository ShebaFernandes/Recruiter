Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
ScanPDF yes
ScanOLE2 yes
ScanArchive yes
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 100M
MaxScanTime 60000
AlertExceedsMax yes
MaxThreads 2
# The default t3.medium host cannot safely hold two signature engines during reload.
# Scans pause briefly while the new database replaces the old one.
ConcurrentDatabaseReload no
SelfCheck 600
