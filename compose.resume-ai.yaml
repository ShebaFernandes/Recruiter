# Optional production overlay. Use only after the hash-pinned legal release is approved.
# The key file must be root-owned, mode 0400, outside the repository and release archive.
services:
  worker:
    secrets:
      - gemini_resume_api_key
    environment:
      RESUME_AI_API_KEY_FILE: /run/secrets/gemini_resume_api_key
      GEMINI_API_KEY: ""
      RESUME_AI_PROVIDER: gemini
      RESUME_AI_MODEL: gemini-3.5-flash-lite
      RESUME_AI_MAX_ATTEMPTS: "1"
      RESUME_AI_FALLBACK: rules
      RESUME_AI_MAX_OUTPUT_TOKENS: "6000"
      RESUME_AI_DAILY_BUDGET_USD: ${RESUME_AI_DAILY_BUDGET_USD:-0}
      RESUME_AI_MONTHLY_BUDGET_USD: ${RESUME_AI_MONTHLY_BUDGET_USD:-0}
      RESUME_AI_INPUT_USD_PER_MILLION: "0.30"
      RESUME_AI_OUTPUT_USD_PER_MILLION: "2.50"
      RESUME_AI_ROLLOUT_MODE: ${RESUME_AI_ROLLOUT_MODE:-disabled}
      RESUME_AI_CANARY_RESUME_IDS: ${RESUME_AI_CANARY_RESUME_IDS:-}
      RESUME_AI_ENABLED: ${RESUME_AI_ENABLED:-false}
      RESUME_AI_EXTERNAL_PROCESSING_APPROVED: ${RESUME_AI_EXTERNAL_PROCESSING_APPROVED:-false}
      RESUME_AI_ALLOW_PAID: ${RESUME_AI_ALLOW_PAID:-false}
      RESUME_AI_GEMINI_FREE_TIER_APPROVED: "false"
      LEGAL_RESUME_AI_APPROVED: ${LEGAL_RESUME_AI_APPROVED:-false}
      LEGAL_RESUME_AI_VERSION: ${LEGAL_RESUME_AI_VERSION:-enter-resume-ai-consent-v1.1}
      LEGAL_RESUME_AI_SHA256: ${LEGAL_RESUME_AI_SHA256:-}

secrets:
  gemini_resume_api_key:
    file: ${ENTER_GEMINI_SECRET_FILE:?Set a root-owned Gemini key file outside the repository}
